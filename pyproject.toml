[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morse-spatial"
version = "0.1.0"
description = "Morphology-informed spatial expression reconstruction: PDAC and Breast Cancer Visium workflows"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = ["torch>=2.6", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10",
                "scikit-learn>=1.3", "anndata>=0.10", "h5py>=3.9", "Pillow>=10", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
